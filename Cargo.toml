[package]
name = "rusty-clicker"
version = "1.2.2"
edition = "2024"
authors = ["Valentino"]
license = "PolyForm-Noncommercial-1.0.0"
build = "build.rs"

[[bin]]
name = "RustyClicker"
path = "src/main.rs"

[dependencies]
corrmatch = { version = "0.2.5", features = ["rayon", "simd"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png"] }
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
embed-resource = "3.0.12"
